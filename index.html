<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Attendance System</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #e9e9e9;
        color: #1d1d1d;
      }

      .page {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 26px 40px;
      }

      .title {
        text-align: center;
        font-size: clamp(2.2rem, 3vw, 4rem);
        font-weight: 800;
        margin: 18px 0 28px;
        letter-spacing: -1px;
        color: #1d1d1d;
      }

      .panel {
        background: #f5f5f5;
        border: 1px solid #d7d7d7;
        border-radius: 10px;
        padding: 20px 18px 18px;
        margin-bottom: 22px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
      }

      .panel h2 {
        margin: 0 0 18px;
        font-size: clamp(2rem, 2vw, 3rem);
        font-weight: 700;
        color: #1d1d1d;
      }

      .input-box,
      .select-box {
        width: 100%;
        height: 58px;
        border: 1px solid #d0d0d0;
        border-radius: 8px;
        background: #f3f3f3;
        padding: 0 18px;
        font-size: 1.1rem;
        color: #2a2a2a;
        outline: none;
      }

      .input-box::placeholder {
        color: #666;
      }

      .primary-btn {
        width: 100%;
        height: 58px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(180deg, #1f8ef8, #1f7de8);
        color: white;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        margin-top: 14px;
        transition: 0.2s ease;
      }

      .primary-btn:hover {
        filter: brightness(1.03);
      }

      .scanner-box {
        width: 100%;
        height: 18px;
        border-top: 1px solid #cfcfcf;
        margin-top: 16px;
      }

      .select-wrap {
        position: relative;
      }

      .select-wrap::after {
        content: "▾";
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: #3a3a3a;
        font-size: 1.4rem;
        pointer-events: none;
      }

      .select-box {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        padding-right: 40px;
      }

      .logout {
        margin-top: 12px;
        display: inline-block;
        padding: 10px 18px;
        border-radius: 8px;
        background: #333;
        color: white;
        text-decoration: none;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .page {
          padding: 20px 14px 30px;
        }

        .panel {
          padding: 18px 14px 16px;
        }

        .title {
          font-size: 2.2rem;
        }

        .panel h2 {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="title">QR Attendance System</div>

      <div class="panel">
        <h2>Admin Panel</h2>

        <input
          class="input-box"
          type="text"
          placeholder="Enter session title"
        />

        <button class="primary-btn">Create Session</button>
      </div>

      <div class="panel">
        <h2>Student Attendance</h2>

        <div class="select-wrap">
          <select class="select-box">
            <option selected disabled>Select Student</option>
            <option>Amit Sharma</option>
            <option>Neha Verma</option>
            <option>Rohit Kumar</option>
            <option>Pooja Singh</option>
          </select>
        </div>

        <button class="primary-btn">Start Scan</button>

        <div class="scanner-box"></div>
      </div>

      <div class="panel">
        <h2>Attendance Report</h2>
      </div>

      <a href="#" class="logout" onclick="logout()">Logout</a>
    </div>

    <script>
      const role = localStorage.getItem("loggedInRole");

      if (!role) {
        window.location.href = "login.html";
      }

      function logout() {
        localStorage.removeItem("loggedInRole");
        localStorage.removeItem("loggedInUser");
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
