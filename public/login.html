<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - QR Attendance</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #e7e7e7;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .login-box {
        width: 420px;
        background: #ffffff;
        border-radius: 12px;
        padding: 28px 26px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        margin: 0 0 22px;
        font-size: 32px;
        color: #1d1d1d;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #222;
      }

      input,
      select,
      button {
        width: 100%;
        height: 50px;
        border-radius: 8px;
        font-size: 16px;
        margin-bottom: 18px;
      }

      input,
      select {
        padding: 0 12px;
        border: 1px solid #d1d1d1;
        outline: none;
      }

      button {
        border: none;
        background: linear-gradient(180deg, #1f8ef8, #1f7de8);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.05);
      }

      .error {
        display: none;
        color: red;
        font-size: 14px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h2>Login</h2>

      <div id="errorMsg" class="error">Invalid username or password</div>

      <label for="role">Login as</label>
      <select id="role">
        <option value="admin">Admin</option>
        <option value="student">Student</option>
      </select>

      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Enter username" />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter password" />

      <button onclick="login()">Login</button>
    </div>

    <script>
      function login() {
        const role = document.getElementById("role").value;
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorMsg = document.getElementById("errorMsg");

        const validUsers = {
          admin: { username: "admin", password: "admin123" },
          student: { username: "student", password: "student123" }
        };

        if (
          username === validUsers[role].username &&
          password === validUsers[role].password
        ) {
          localStorage.setItem("loggedInRole", role);
          localStorage.setItem("loggedInUser", username);
          window.location.href = "index.html";
        } else {
          errorMsg.style.display = "block";
        }
      }
    </script>
  </body>
</html>
